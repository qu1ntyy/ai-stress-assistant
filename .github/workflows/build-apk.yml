
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "client/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website assets
        run: |
          mkdir -p app/src/main/assets/www
          if [ -f client/index.html ]; then
            echo "Using maintained source directory: client/"
            cp -r client/. app/src/main/assets/www/
          else
            echo "Source directory not found; falling back to website ZIP"
            mkdir -p extracted
            found=0
            for archive in *.zip; do
              [ -f "$archive" ] || continue
              mkdir -p temp_extract
              unzip -oq "$archive" -d temp_extract
              INDEX=$(find temp_extract -name index.html | head -n 1)
              if [ -n "$INDEX" ]; then
                WEBROOT=$(dirname "$INDEX")
                cp -r "$WEBROOT"/. app/src/main/assets/www/
                found=1
                break
              fi
              rm -rf temp_extract
            done
            if [ "$found" -ne 1 ]; then
              echo "Website source not found"
              exit 1
            fi
          fi
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/src/app.js

      - name: Validate web app assets
        run: |
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/styles/main.css
          test -f app/src/main/assets/www/src/app.js
          node --check app/src/main/assets/www/src/app.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/stressassistant/app
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StressAssistant"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          val releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
          val releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
          val releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
          val releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
          android {
              namespace = "com.stressassistant.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.stressassistant.app"
                  minSdk = 24
                  targetSdk = 35
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
                  versionCode = 10
                  versionName = "0.5.5"
              }
              if (!releaseStoreFile.isNullOrBlank() && !releaseStorePassword.isNullOrBlank() && !releaseKeyAlias.isNullOrBlank() && !releaseKeyPassword.isNullOrBlank()) {
                  signingConfigs {
                      create("release") {
                          storeFile = file(releaseStoreFile)
                          storePassword = releaseStorePassword
                          keyAlias = releaseKeyAlias
                          keyPassword = releaseKeyPassword
                      }
                  }
                  buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Mindful Space"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/stressassistant/app/MainActivity.kt <<'EOF'
          package com.stressassistant.app

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.webkit.ValueCallback

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var fileChooserCallback: ValueCallback<Array<Uri>>? = null
              private var pendingExport: String = ""
              private val fileChooserRequestCode = 1001
              private val exportRequestCode = 1002

              inner class MindfulStorage(context: Context) {
                  private val prefs = context.getSharedPreferences("mindful_space_data", Context.MODE_PRIVATE)

                  @JavascriptInterface
                  fun load(): String = prefs.getString("app_data", "") ?: ""

                  @JavascriptInterface
                  fun save(value: String) {
                      prefs.edit().putString("app_data", value).commit()
                  }

                  @JavascriptInterface
                  fun clear() {
                      prefs.edit().remove("app_data").commit()
                  }

                  @JavascriptInterface
                  fun exportData(value: String) {
                      runOnUiThread {
                          pendingExport = value
                          val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "application/json"
                              putExtra(Intent.EXTRA_TITLE, "mindful-space-backup.json")
                          }
                          try {
                              startActivityForResult(intent, exportRequestCode)
                          } catch (_: Exception) {
                              pendingExport = ""
                              android.widget.Toast.makeText(this@MainActivity, "Не удалось открыть сохранение файла", android.widget.Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              @Suppress("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setSoftInputMode(
                      WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  )
                  webView = WebView(this)
                  webView.layoutParams = ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  )
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.allowContentAccess = false
                  webView.settings.javaScriptCanOpenWindowsAutomatically = false
                  webView.settings.setSupportMultipleWindows(false)
                  webView.settings.allowFileAccessFromFileURLs = false
                  webView.settings.allowUniversalAccessFromFileURLs = false
                  webView.addJavascriptInterface(MindfulStorage(this), "MindfulStorage")
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(view: WebView?, filePathCallback: ValueCallback<Array<Uri>>?, fileChooserParams: FileChooserParams?): Boolean {
                          fileChooserCallback?.onReceiveValue(null)
                          fileChooserCallback = filePathCallback
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "application/json" }
                          return try { startActivityForResult(intent, fileChooserRequestCode); true } catch (_: Exception) { fileChooserCallback?.onReceiveValue(null); fileChooserCallback = null; false }
                      }
                  }
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/www/index.html")
              }

              @Deprecated("Deprecated in Android")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == fileChooserRequestCode) {
                      val result = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      fileChooserCallback?.onReceiveValue(result)
                      fileChooserCallback = null
                  } else if (requestCode == exportRequestCode) {
                      val uri = if (resultCode == RESULT_OK) data?.data else null
                      if (uri != null) {
                          try {
                              contentResolver.openOutputStream(uri)?.use { it.write(pendingExport.toByteArray(Charsets.UTF_8)) }
                              android.widget.Toast.makeText(this, "Резервная копия сохранена", android.widget.Toast.LENGTH_LONG).show()
                          } catch (_: Exception) {
                              android.widget.Toast.makeText(this, "Не удалось сохранить резервную копию", android.widget.Toast.LENGTH_LONG).show()
                          }
                      }
                      pendingExport = ""
                  }
              }
              
              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack()
                  else super.onBackPressed()
              }
          }
          EOF

      - name: Prepare release signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mindful-space-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mindful-space-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Build debug APK (until release signing is configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Stress-Assistant-APK
          path: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'app/build/outputs/apk/release/app-release.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}
